<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; }
      .sans { font-family: 'DejaVu Sans', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0a0b0d"/>

  <!-- subtle grid -->
  <g stroke="#1a1d20" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- accent corner mark -->
  <circle cx="1080" cy="150" r="4" fill="#4dd0e1"/>
  <circle cx="120" cy="480" r="4" fill="#4dd0e1"/>

  <!-- avatar ring -->
  <circle cx="150" cy="150" r="52" fill="none" stroke="#232729" stroke-width="2"/>
  <text x="150" y="163" text-anchor="middle" class="mono" font-size="34" font-weight="700" fill="#4dd0e1">RK</text>

  <text x="240" y="140" class="mono" font-size="22" fill="#4dd0e1">Rohan Khurana</text>
  <text x="240" y="178" class="sans" font-size="20" fill="#a5a6ae">Senior Software Engineer · Full-Stack</text>

  <text x="120" y="290" class="sans" font-size="54" font-weight="700" fill="#f1f1f0">Backend, Cloud &amp; AI</text>
  <text x="120" y="355" class="sans" font-size="54" font-weight="700" fill="#f1f1f0">Systems Engineer</text>

  <text x="120" y="410" class="sans" font-size="24" fill="#a5a6ae">C# / .NET · Azure · AWS · GCP · RAG &amp; LLM Systems</text>

  <g class="mono" font-size="18" fill="#6c6d76">
    <text x="120" y="560">$ uptime --experience</text>
    <text x="120" y="588" fill="#f1f1f0">4+ years, 3 clouds, 0 downtime migrations</text>
  </g>

  <text x="1080" y="588" text-anchor="end" class="mono" font-size="18" fill="#6c6d76">github.com/rohan-khurana</text>
</svg>
